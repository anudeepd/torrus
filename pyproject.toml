[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torrus"
version = "0.2.52"
description = "Web-based SSH terminal that works behind any reverse proxy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anudeep Dhavaleswarapu", email = "anudeepd2@gmail.com" }]
keywords = ["ssh", "terminal", "web", "xterm", "remote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.110.0",
    "python-socketio>=5.11.0",
    "uvicorn[standard]>=0.29.0",
    "paramiko>=3.4.0",
    "aiofiles>=23.2.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
ldap = ["ldapgate>=0.1.28,<0.2"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/anudeepd/torrus"
Repository = "https://github.com/anudeepd/torrus"
Issues = "https://github.com/anudeepd/torrus/issues"

[project.scripts]
torrus = "torrus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torrus = ["static/**/*", "static/*", "templates/*"]

[tool.ruff]
target-version = "py310"
line-length = 120
# src/torrus/upload_engine.py is a byte-identical copy of xwing's engine and the
# parity test compares the two files, so formatting it here breaks that contract.
extend-exclude = ["src/torrus/upload_engine.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "EM", "FA", "ISC",
    "PIE", "PL", "PT", "RET", "RUF", "SLF", "SLOT", "T10", "T20", "TCH", "YTT",
]
ignore = [
    "E501",    # line too long
    "EM101",   # exception string literals – too noisy for guard clauses
    "EM102",   # exception f-string literals – same
    "E402",    # module-level import order – intentional circular dep avoidance
    "PLC0415", # import at top-level – intentional lazy imports
    "PLR0911", # too many return statements – architectural
    "PLR0912", # too many branches – architectural
    "PLR0913", # too many arguments – architectural
    "PLR0915", # too many statements – architectural
    "PLR2004", # magic value comparisons – numeric constants are fine
    "N818",    # exception name suffix – minor naming concern
    "SLF001",  # access to private member – sometimes necessary
    "RUF001",  # ambiguous character in string – prose in docstrings
    "SIM105",  # try/except/pass is deliberate in best-effort cleanup paths
]

[tool.ruff.lint.per-file-ignores]
# Test doubles keep the signatures they imitate and pytest fixtures are requested
# for their side effects, so unused parameters are expected in tests.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:fastapi\\.routing",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:asyncio\\.threads",
]
