sonar.organization=anudeepd
sonar.projectKey=anudeepd_torrus
sonar.python.version=3.10, 3.11, 3.12

# Application code is analyzed normally; Python tests get the test-specific rule set.
sonar.sources=src/torrus,frontend
sonar.tests=tests
# Generated bundles, fixtures, and build tooling stay out of both scopes.
sonar.exclusions=.venv/**,.git/**,.github/**,.pytest_cache/**,.ruff_cache/**,.scannerwork/**,artifacts/**,assets/**,dist/**,src/torrus.egg-info/**,scripts/**,testdata/**,tools/**,**/__pycache__/**,**/*.pyc,**/*.pyo,src/torrus/static/**,src/torrus/templates/**,frontend/node_modules/**,frontend/package*.json,frontend/*.config.*,frontend/eslint.config.js,frontend/tsconfig*.json,frontend/**/*.test.*,frontend/test/**,frontend/src/test/**,**/*.d.ts,ldapgate.yaml

sonar.python.coverage.reportPaths=coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
