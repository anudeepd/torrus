sonar.organization=anudeepd
sonar.projectKey=anudeepd_torrus
sonar.python.version=3.10, 3.11, 3.12
sonar.sourceEncoding=UTF-8

# SonarCloud analyzes the whole project. Keep generated, fixture, binary,
# test-support, and build files out; Python tests are detected as test files.
sonar.exclusions=.venv/**,.git/**,.github/**,.pytest_cache/**,.ruff_cache/**,.scannerwork/**,artifacts/**,assets/**,dist/**,src/torrus.egg-info/**,scripts/**,testdata/**,tools/**,**/__pycache__/**,**/*.pyc,**/*.pyo,src/torrus/static/**,src/torrus/templates/**,frontend/node_modules/**,frontend/package*.json,frontend/*.config.*,frontend/eslint.config.js,frontend/tsconfig*.json,frontend/src/fonts/**,frontend/public/**,frontend/**/*.test.*,frontend/test/**,frontend/src/test/**,**/*.d.ts,**/*.woff,**/*.woff2,**/*.ttf,**/*.otf,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.ico,ldapgate.yaml

sonar.python.coverage.reportPaths=coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
