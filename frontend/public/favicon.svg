<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#ecfdf5"/>

  <!-- Torus rings (donut front-view) -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#16a34a" stroke-width="3.6"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#0d9488" stroke-width="3.2"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#10b981" stroke-width="2.8"/>

  <!-- Prompt chevron ">" inside the torus hole -->
  <polyline fill="none" stroke="#0d9488" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
    points="52,56 64,64 52,72"/>

  <!-- Cursor block -->
  <rect x="70" y="58" width="8" height="12" rx="1.5" fill="#10b981"/>
</svg>
