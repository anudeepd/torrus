name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release and publish to PyPI after checks pass
        type: boolean
        required: true
        default: false
      bump:
        description: Version increment to apply when publishing
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test --extra ldap
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: frontend and bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm run test
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend
      - name: The committed bundle matches frontend/src
        run: |
          if ! git diff --quiet -- src/torrus/static; then
            echo "::error::src/torrus/static is stale — run 'make build' and commit the result"
            git --no-pager diff --stat -- src/torrus/static
            exit 1
          fi

  build-dist:
    name: build and smoke-test distributions
    needs: [backend, frontend, release-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Apply selected release version
        if: ${{ inputs.publish }}
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: python3 scripts/release_version.py set "$RELEASE_VERSION"
      - name: Verify release version and lock
        run: |
          python3 scripts/release_version.py current
          uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/torrus-smoke
          uv pip install --python /tmp/torrus-smoke/bin/python dist/*.whl
          /tmp/torrus-smoke/bin/python - <<'PY'
          from importlib.resources import files
          from pathlib import Path

          import torrus.server  # noqa: F401

          static = Path(str(files("torrus").joinpath("static")))
          assert (static / "index.html").is_file()
          assert (static / "manifest.webmanifest").is_file()
          assert (static / "assets").is_dir()
          print("Installed wheel smoke test passed:", static)
          PY
          /tmp/torrus-smoke/bin/torrus --help
      - name: Check distribution names and versions
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          artifacts = sorted(
              path.name
              for path in Path("dist").iterdir()
              if path.is_file() and path.name != ".gitignore"
          )
          expected_sdist = f"torrus-{version}.tar.gz"
          wheels = [name for name in artifacts if name.startswith(f"torrus-{version}-") and name.endswith(".whl")]
          if len(wheels) != 1 or artifacts != sorted([expected_sdist, *wheels]):
              raise SystemExit(
                  f"expected one torrus {version} wheel and {expected_sdist}; found {artifacts}"
              )
          print("Validated distributions:", *artifacts, sep="\n  ")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: torrus-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release-version:
    name: Calculate and validate release version
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Choose release version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" && ( "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "main" ) ]]; then
            echo "::error::Publishing must be dispatched from the main branch."
            exit 1
          fi
          if [[ "$PUBLISH" == "true" ]]; then
            version="$(python3 scripts/release_version.py next --bump "$BUMP")"
          else
            version="$(python3 scripts/release_version.py current)"
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == "true" ]]; then
            set +e
            git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "::error::Release tag $tag already exists."
              exit 1
            elif [[ "$status" -ne 2 ]]; then
              exit "$status"
            fi
          fi
          echo "Selected Torrus $version ($tag)."

  prepare-release:
    name: Commit synchronized release versions to main
    if: ${{ inputs.publish }}
    needs: [build-dist, release-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Synchronize version files and commit to main
        id: commit
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Refusing to commit release versions outside main."
            exit 1
          fi
          python3 scripts/release_version.py set "$RELEASE_VERSION"
          uv lock --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/torrus/__init__.py uv.lock frontend/package.json frontend/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::The release version did not change any manifests."
            exit 1
          fi
          git commit -m "chore(release): torrus $RELEASE_VERSION"
          git push origin HEAD:refs/heads/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"



  github-release:
    name: create GitHub Release
    if: ${{ inputs.publish }}
    needs: [build-dist, release-version, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: torrus-dist
          path: dist
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$RELEASE_COMMIT"
          --title "Torrus $RELEASE_TAG"
          --generate-notes

  pypi-publish:
    name: publish to PyPI with trusted publishing
    if: ${{ inputs.publish }}
    needs: [build-dist, release-version, prepare-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torrus
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: torrus-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
